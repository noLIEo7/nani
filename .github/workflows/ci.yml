name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR replaces a run that is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS runners are scarce (jobs often wait long for one): only pull requests test
        # there; pushes to main are covered by their pull request, and releases test on macOS.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') || fromJSON('["ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Test
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  # Longer randomized test run (see src/fuzz.rs).
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Randomized tests (2000 seeds)
        if: hashFiles('src/fuzz.rs') != ''
        env:
          NANI_FUZZ_SEEDS: "2000"
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: "true"
          CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: "true"
        run: cargo test --locked --release fuzz

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck install.sh
        run: shellcheck install.sh
