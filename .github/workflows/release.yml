name: Release

# Push a tag like v0.1.0 to build binaries for all systems and publish a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: nani-linux-x86_64.tar.gz
            test: true
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: nani-macos-arm64.tar.gz
            test: true
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: nani-macos-x86_64.tar.gz
            test: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: nani-windows-x86_64.zip
            test: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Test
        if: matrix.test
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package (Linux, macOS)
        if: runner.os != 'Windows'
        run: tar -czf ${{ matrix.asset }} -C target/${{ matrix.target }}/release nani
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path target/${{ matrix.target }}/release/nani.exe -DestinationPath ${{ matrix.asset }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

  # Installs the new release with the one-line installers from the README on every system.
  install-check:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/install.sh | PREFIX="$HOME/nani-bin" sh
          "$HOME/nani-bin/nani" --version | grep -F "${GITHUB_REF_NAME#v}"
      - name: Install (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          irm https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/install.ps1 | iex
          $v = & "$env:LOCALAPPDATA\Programs\nani\nani.exe" --version
          if ($v -notlike "*$("${{ github.ref_name }}".TrimStart('v'))*") { throw "wrong version: $v" }
