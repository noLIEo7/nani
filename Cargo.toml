[package]
name = "nani"
version = "0.1.2"
edition = "2021"
description = "A modern, fast, lightweight nano-style terminal text editor"
license = "MIT"
repository = "https://github.com/noLIEo7/nani"

[dependencies]
crossterm = "0.29"
unicode-width = "0.2"
unicode-segmentation = "1"
ropey = { version = "1.6", default-features = false, features = ["simd"] }
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }

[target.'cfg(unix)'.dependencies]
# Ctrl+E commands run in a session of their own; asks the terminal how it measures emoji (mode 2027)
libc = "0.2"

[lints.clippy]
# false positive: fires on closures that are called more than once (clippy 1.97)
redundant_closure_call = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
